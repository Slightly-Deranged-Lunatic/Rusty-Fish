[package]
name = "rusty-fish"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
directories = "6.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
ftail = "0.3"
log = "0.4.33"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
rand = "0.10.2"


# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
